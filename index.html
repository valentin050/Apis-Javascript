<!DOCTYPE html>
<html lang="en">
<head>
    <!-- This is where the metadata goes -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fetch a GIF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link href="./css/style.css" rel="stylesheet">
</head>
<body>
    <main class="container my-5">
        <!-- Here is the title -->
        <h1 class="mb-4 text-center">Fetch a GIF</h1>
        <div class="row justify-content-center mb-3">
            <div class="col-md-6">
                <label for="api-key" class="form-label">Giphy API key</label>
                <input type="password" id="api-key" class="form-control mb-3" placeholder="Enter your Giphy API key" autocomplete="off">
                <label for="search-input" class="form-label">Search for a GIF</label>
                <input type="text" id="search-input" class="form-control" placeholder="Example: running">
            </div>
        </div>
        <!-- Fetch the GIFs when the button is clicked -->
        <div class="d-flex justify-content-center mb-4">
            <button type="button" id="fetch-gif-btn" class="btn btn-primary">Fetch a GIF</button>
        </div>
        <p id="status-text" class="text-center" aria-live="polite"></p>
        <div id="gif-container" class="row">
            <!-- Output the GIFs here -->
        </div>
        <p class="text-center mt-4">Powered by GIPHY</p>
    </main>
    <!-- Connect to the script file -->
    <script src="./js/script.js"></script>
</body>
</html>
